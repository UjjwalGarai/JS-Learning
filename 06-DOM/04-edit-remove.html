<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black; color: white;">


    <ul class="language">
        <li>JavaScript</li>
    </ul>

    <script>
        function createLangeuage(language){
            const li = document.createElement('li')
            li.innerHTML = language
            document.querySelector(".language").appendChild(li) 
        }
        createLangeuage('Python')

        function OptiLanguage(lang){
            const li = document.createElement('li')
            li.append(document.createTextNode(lang))
            document.querySelector('.language').appendChild(li)
        }
        OptiLanguage("Ruby")
        OptiLanguage("SQL")


        // Edit
        const python = document.querySelector("li:nth-child(2)")
        python.innerHTML = "Java"
        python.style.backgroundColor = 'red'


        // replace
        const js = document.querySelector('li:first-child')
        console.log(js);
        const ts = document.createElement('li')//.textContent = "Type"
        ts.innerHTML = 'TypeScript'
        js.replaceWith(ts)
        console.log(ts)

        // remove
        const sql = document.querySelector('li:last-child')
        sql.remove()
        
    </script>
</body>
</html>
